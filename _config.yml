repository: m-colley/CHI26-HITL-MOBO
title: Human-in-the-Loop Bayesian Optimization for ALL:
email: "m.colley@ucl.ac.uk"
description: "Human-in-the-Loop Bayesian Optimization for ALL"

remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: contrast
search: true
baseurl: /CHI26-HITL-MOBO
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
#timezone: Europe/Berlin

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  bio: >-
    HITL MOBO for ALL!
    *In conjunction with [CHI 2026](https://chi2026.acm.org/)*

announcement: "[Call for Contributions open **NOW**!](https://easychair.org/my/conference){: .align--left .btn .btn--info .btn--large }"

footer:
  links:
    - label: "Imprint"
      icon: "fa fa-fw fa-info"
      url: "/CHI26-HITL-MOBO/Imprint/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
